[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-bot"
version = "0.1.0"
description = "Graph API bot for a Facebook Page: fetch the page feed and post updates. No browser."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.16",
]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.scripts]
social-bot = "social_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# The ruleset is pinned so the check does not shift with ruff's evolving
# defaults. E501 is off — the formatter owns line length, and long strings
# (URLs, HTML fragments, the stylesheet) must not be re-wrapped.
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
