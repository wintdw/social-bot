# Template for social-bot secrets. Copy the real one into place (it is
# git-ignored) and put your token in it:
#
#   cp credentials.example.yaml credentials.yaml
#   # edit credentials.yaml, then:
#   .venv/bin/social-bot whoami
#
# Tokens live under each destination, mirroring config.yaml's `destinations`
# block. Resolution order per destination: `--token` > SOCIAL_BOT_<NAME>_TOKEN
# (e.g. SOCIAL_BOT_FACEBOOK_TOKEN) > SOCIAL_BOT_TOKEN (global fallback) > this
# file.
#
# Mint a Page access token at developers.facebook.com (Graph API Explorer ->
# Get Page Access Token) with pages_read_engagement, pages_manage_posts and
# pages_show_list.
destinations:
  facebook:
    token: ""
  linkedin:
    # Not used until the LinkedIn adapter is implemented.
    token: ""

# Pollinations.ai API key for AI image generation (image_gen in config.yaml).
# The default endpoint (gen.pollinations.ai/image) REQUIRES a valid key —
# without one every generation fails with HTTP 401 and the draft keeps its
# current image. Get a key at https://enter.pollinations.ai/keys. (The legacy
# image.pollinations.ai/prompt endpoint needs no key, but it is watermarked and
# cannot choose a model.)
image_gen:
  api_key: ""
